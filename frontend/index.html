        <div class="auth-switch">Already have an account? <button id="toLogin2">Log in</button></div>
        <div class="admin-link-row"><button class="admin-link" id="signupToHome">← Back to home</button></div>
      </div>
    </div>
  `;
  const f = id => document.getElementById(id);
  f('toggleSPw').onclick = () => { const i=f('sPw'); const show=i.type==='text'; i.type=show?'password':'text'; f('toggleSPw').textContent = show?'SHOW':'HIDE'; };
  f('toggleSPw2').onclick = () => { const i=f('sPw2'); const show=i.type==='text'; i.type=show?'password':'text'; f('toggleSPw2').textContent = show?'SHOW':'HIDE'; };
  f('signupToHome').onclick = () => setView('home');
  f('toLogin2').onclick = () => setView('login');
  f('signupPrivacyLink').onclick = () => openPrivacyModal();

  f('sPhone').addEventListener('input', () => {
    const digits = f('sPhone').value.replace(/\D/g,'').slice(0,11);
    if (digits !== f('sPhone').value) f('sPhone').value = digits;
  });

  function pwStrongEnough(pw){ return pw.length >= 8 && /[A-Za-z]/.test(pw) && /[0-9]/.test(pw); }

  f('submitSignup').onclick = async () => {
    f('signupError').innerHTML = '';
    let valid = true;
    const name = f('sFullName').value.trim();
    const email = f('sEmail').value.trim();
    const phone = f('sPhone').value.trim();
    const pw = f('sPw').value;
    const pw2 = f('sPw2').value;

    if (!name){ f('fldSFullName').classList.add('invalid'); valid = false; } else f('fldSFullName').classList.remove('invalid');
    if (!isEmailLike(email)){ f('fldSEmail').classList.add('invalid'); valid = false; } else f('fldSEmail').classList.remove('invalid');
    if (!isPhoneLike(phone) || phone.length < 7){ f('fldSPhone').classList.add('invalid'); valid = false; } else f('fldSPhone').classList.remove('invalid');
    if (!pwStrongEnough(pw)){ f('fldSPw').classList.add('invalid'); valid = false; } else f('fldSPw').classList.remove('invalid');
    if (pw !== pw2 || !pw2){ f('fldSPw2').classList.add('invalid'); valid = false; } else f('fldSPw2').classList.remove('invalid');
    const termsOk = f('sTerms').checked;
    f('fldTerms').classList.toggle('invalid', !termsOk);
    if (!termsOk) valid = false;
    if (!valid) return;

    const btn = f('submitSignup');
    btn.disabled = true;
    btn.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span>Submitting registration…';

    try{
      // The backend hashes the password with bcrypt, checks for a
      // duplicate email/phone, creates the user row (role = "user"), and
      // sets the login cookie — all server-side.
      await apiFetch('/auth/register', {method:'POST', body:{
        fullName: name, email, phone,
        emergencyContact: f('sEmergency').value.trim(),
        password: pw
      }});
    }catch(e){
      btn.disabled = false; btn.textContent = 'CREATE ACCOUNT';
      f('signupError').innerHTML = `<div class="form-error-banner">${escapeHtml(e.message)}</div>`;
      return;
    }

    app.innerHTML = `
      <div class="auth-wrap">
        <div class="reg-card">
          <div class="form-success-banner">✓ Account created. You're logged in.</div>
          <p style="color:var(--muted);font-size:13px;line-height:1.6;">Your account is stored in the SIGNAL backend database, not just this browser — you can log in with it from any device.</p>
          <button class="primary-btn" id="afterSignupHome" style="margin-top:14px;">Continue to SIGNAL</button>
        </div>
      </div>
    `;
    document.getElementById('afterSignupHome').onclick = () => setView('home');
  };
}

/* =========================================================================
   FORGOT PASSWORD
   -------------------------------------------------------------------------
   Calls the real backend (POST /api/auth/forgot-password). The backend
   always returns the same generic message whether or not the email is
   registered, so this screen never reveals which accounts exist — it just
   passes that message through. Email only (not phone), since the backend
   reset flow is email-based (it sends the reset link via SMTP).
   ========================================================================= */
function renderForgotPassword(){
  app.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-brand">
        <div class="ab-dot"></div>
        <h1 class="display">RESET YOUR PASSWORD</h1>
        <p>Enter the email address on your account.</p>
      </div>
      <div class="reg-card">
        <div id="forgotBody">
          <div class="field" id="fldForgot">
            <label>Email address <span class="req">*</span></label>
            <input id="forgotId" type="email" autocomplete="email" placeholder="name@example.com">
            <div class="field-error">Enter a valid email address.</div>
          </div>
          <button class="primary-btn" id="sendReset" type="button">SEND RESET LINK</button>
          <div class="admin-link-row"><button class="admin-link" id="backToLoginFromForgot">← Back to login</button></div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('backToLoginFromForgot').onclick = () => setView('login');
  const input = document.getElementById('forgotId');
  const doSend = async () => {
    const field = document.getElementById('fldForgot');
    const email = input.value.trim();
    if (!isEmailLike(email)){ field.classList.add('invalid'); return; }
    field.classList.remove('invalid');
    const btn = document.getElementById('sendReset');
    btn.disabled = true;
    btn.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span>Sending reset instructions…';

    let message = 'If an account exists for this email, a password reset link has been sent.';
    try{
      // The backend response is intentionally the same either way — this
      // just displays whatever generic message it returns.
      const data = await apiFetch('/auth/forgot-password', {method:'POST', body:{ email }});
      if (data && data.message) message = data.message;
    }catch(e){
      // Only genuine failures to reach the backend surface here (e.g.
      // server not running) — that's infrastructure info, not account info.
      btn.disabled = false;
      btn.textContent = 'SEND RESET LINK';
      document.getElementById('forgotBody').insertAdjacentHTML('beforeend', `<div class="form-error-banner" style="margin-top:12px;">${escapeHtml(e.message)}</div>`);
      return;
    }

    document.getElementById('forgotBody').innerHTML = `
      <div class="form-success-banner">${escapeHtml(message)}</div>
      <p style="color:var(--muted);font-size:12px;line-height:1.6;">Check your inbox (and spam folder) for the reset link. It expires after a short time — you can come back here and request a new one if it does.</p>
      <button class="secondary-btn" id="backToLoginFromForgot2" style="margin-top:14px;">← Back to login</button>
    `;
    document.getElementById('backToLoginFromForgot2').onclick = () => setView('login');
  };
  document.getElementById('sendReset').onclick = doSend;
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSend(); });
}

/* =========================================================================
   RESET PASSWORD — opened via the link emailed by the backend, which points
   back at this same SIGNAL frontend with a ?token=... query parameter (see
   initialRoute() below, which reads it and jumps straight to this view).
   Calls POST /api/auth/reset-password with {token, password}.
   ========================================================================= */
let resetToken = null;

function renderResetPassword(){
  if (!resetToken){
    app.innerHTML = `
      <div class="auth-wrap">
        <div class="auth-brand">
          <div class="ab-dot"></div>
          <h1 class="display">RESET LINK MISSING</h1>
          <p>This page needs a valid reset link to continue.</p>
        </div>
        <div class="reg-card">
          <div class="form-error-banner">No reset token was found in this link. Please use the link from your password reset email, or request a new one.</div>
          <button class="primary-btn" id="resetToForgot" style="margin-top:14px;">Request new reset link</button>
          <div class="admin-link-row"><button class="admin-link" id="resetToLogin">← Back to login</button></div>
        </div>
      </div>
    `;
    document.getElementById('resetToForgot').onclick = () => setView('forgot');
    document.getElementById('resetToLogin').onclick = () => setView('login');
    return;
  }

  app.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-brand">
        <div class="ab-dot"></div>
        <h1 class="display">SET A NEW PASSWORD</h1>
        <p>Choose a new password for your account.</p>
      </div>
      <div class="reg-card">
        <div id="resetBody">
          <div class="field" id="fldRPw">
            <label>New password <span class="req">*</span></label>
            <div class="password-field">
              <input id="rPw" type="password" autocomplete="new-password">
              <button type="button" class="password-toggle" id="toggleRPw" aria-label="Show password">SHOW</button>
            </div>
            <div class="pw-requirements">At least 8 characters, one letter and one number.</div>
            <div class="field-error">Password does not meet the requirements above.</div>
          </div>
          <div class="field" id="fldRPw2">
            <label>Confirm new password <span class="req">*</span></label>
            <div class="password-field">
              <input id="rPw2" type="password" autocomplete="new-password">
              <button type="button" class="password-toggle" id="toggleRPw2" aria-label="Show password">SHOW</button>
            </div>
            <div class="field-error">Passwords do not match.</div>
          </div>
          <div id="resetError"></div>
          <button class="primary-btn" id="submitReset" type="button">RESET PASSWORD</button>
          <div class="admin-link-row"><button class="admin-link" id="resetBackToLogin">← Back to login</button></div>
        </div>
      </div>
    </div>
  `;
  const f = id => document.getElementById(id);
  f('toggleRPw').onclick = () => { const i=f('rPw'); const show=i.type==='text'; i.type=show?'password':'text'; f('toggleRPw').textContent = show?'SHOW':'HIDE'; };
  f('toggleRPw2').onclick = () => { const i=f('rPw2'); const show=i.type==='text'; i.type=show?'password':'text'; f('toggleRPw2').textContent = show?'SHOW':'HIDE'; };
  f('resetBackToLogin').onclick = () => setView('login');

  function pwStrongEnough(pw){ return pw.length >= 8 && /[A-Za-z]/.test(pw) && /[0-9]/.test(pw); }

  const doReset = async () => {
    f('resetError').innerHTML = '';
    let valid = true;
    const pw = f('rPw').value;
    const pw2 = f('rPw2').value;
    if (!pwStrongEnough(pw)){ f('fldRPw').classList.add('invalid'); valid = false; } else f('fldRPw').classList.remove('invalid');
    if (pw !== pw2 || !pw2){ f('fldRPw2').classList.add('invalid'); valid = false; } else f('fldRPw2').classList.remove('invalid');
    if (!valid) return;

    const btn = f('submitReset');
    btn.disabled = true;
    btn.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span>Resetting password…';

    try{
      // Backend verifies the token hash, checks expiry + single-use, then
      // hashes and stores the new password server-side with bcrypt.
      await apiFetch('/auth/reset-password', {method:'POST', body:{ token: resetToken, password: pw }});
    }catch(e){
      btn.disabled = false;
      btn.textContent = 'RESET PASSWORD';
      f('resetError').innerHTML = `<div class="form-error-banner">${escapeHtml(e.message)}</div>`;
      return;
    }

    // The token is single-use server-side already; clearing it here too
    // stops this same view from trying to resubmit it on a refresh.
    resetToken = null;

    document.getElementById('resetBody').innerHTML = `
      <div class="form-success-banner">✓ Your password has been reset. You can now log in with your new password.</div>
      <button class="primary-btn" id="resetDoneToLogin" style="margin-top:14px;">Go to login</button>
    `;
    document.getElementById('resetDoneToLogin').onclick = () => setView('login');
  };
  f('submitReset').onclick = doReset;
  f('rPw2').addEventListener('keydown', (e) => { if (e.key === 'Enter') doReset(); });
}

/* =========================================================================
   ACCOUNT (minimal demo account screen)
   ========================================================================= */
async function renderAccount(){
  const acct = await getCurrentAccount();
  if (!acct){ setView('login'); return; }
  app.innerHTML = `
    <div class="reg-card">
      <h2 class="display">Your account</h2>
      <p>Frontend prototype account details, stored only in this browser.</p>
      <div class="profile-row"><span class="pr-label">Name</span><span class="pr-val">${escapeHtml(acct.fullName)}</span></div>
      <div class="profile-row"><span class="pr-label">Email</span><span class="pr-val">${escapeHtml(acct.email)}</span></div>
      <div class="profile-row"><span class="pr-label">Phone</span><span class="pr-val">${escapeHtml(acct.phone)}</span></div>
      <div class="profile-row"><span class="pr-label">Emergency contact</span><span class="pr-val">${escapeHtml(acct.emergencyContact||'—')}</span></div>
      <div class="btn-row" style="margin-top:16px;">
        <button class="secondary-btn" id="acctPrivacy">Privacy & data</button>
        <button class="primary-btn" id="acctLogout">Log out</button>
      </div>
    </div>
  `;
  document.getElementById('acctPrivacy').onclick = () => openPrivacyModal();
  document.getElementById('acctLogout').onclick = async () => { try{ await apiFetch('/auth/logout', {method:'POST'}); }catch(e){} toast('Logged out', null); setView('home'); };
}

/* =========================================================================
   WELCOME GATE — shown once on initial load (after the splash) for anyone
   not already logged in. Logging in/creating an account is entirely
   optional here: since SIGNAL is an emergency tool, sending an SOS is
   never blocked behind an account — "I need help now" and "Continue
   without an account" both skip straight past this screen.
   ========================================================================= */
function renderGate(){
  app.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-brand">
        <div class="ab-dot"></div>
        <h1 class="display">SIGNAL</h1>
        <p>Community Distress Network</p>
      </div>
      <div class="reg-card">
        <h2 class="display">Welcome</h2>
        <p>Log in or create an account to keep your rescuer profile and details saved on this browser — or continue without one.</p>
        <button class="primary-btn" id="gateLogin" type="button">LOG IN</button>
        <div class="btn-row" style="margin-top:10px;">
          <button class="secondary-btn" id="gateSignup" type="button">Create account</button>
        </div>
        <div class="auth-switch" style="margin-top:18px;">
          <button id="gateGuest" type="button">Continue without an account →</button>
        </div>
      </div>
      <button class="role-card need" id="gateSOS" type="button" style="margin-top:14px;">
        <div class="role-eyebrow">Emergency? Skip all of this</div>
        <h2>I need help now</h2>
        <p>Go straight to sending a distress signal — no account needed.</p>
      </button>
    </div>
  `;
  document.getElementById('gateLogin').onclick = () => setView('login');
  document.getElementById('gateSignup').onclick = () => setView('signup');
  document.getElementById('gateGuest').onclick = () => setView('home');
  document.getElementById('gateSOS').onclick = () => setView('need');
}

/* =========================================================================
   ROUTER
   ========================================================================= */
function render(){
  if (view === 'home') renderHome();
  else if (view === 'gate') renderGate();
  else if (view === 'need') renderNeed();
  else if (view === 'rescuer') renderRescuer();
  else if (view === 'admin') renderAdmin();
  else if (view === 'login') renderLogin();
  else if (view === 'signup') renderSignup();
  else if (view === 'forgot') renderForgotPassword();
  else if (view === 'reset') renderResetPassword();
  else if (view === 'account') renderAccount();
}

// idle brand pulse
setInterval(() => {
  brandDot.style.opacity = brandDot.style.opacity === '0.3' ? '1' : '0.3';
}, 900);

/* Initial route: logged-in users go straight to the home screen; everyone
   else sees the welcome gate (login/create account/skip) once, right
   after the splash. This runs immediately, underneath the still-visible
   splash overlay, so there's no extra flash once the splash fades.

   Exception: if this page was opened from the password-reset email link
   (?token=...), skip straight to the reset-password view regardless of
   login state — that's the whole point of the link. */
(async function initialRoute(){
  let urlToken = null;
  try{
    urlToken = new URLSearchParams(window.location.search).get('token');
  }catch(e){}

  if (urlToken){
    resetToken = urlToken;
    // Scrub the token out of the visible URL/history right after reading
    // it, so it isn't left sitting in the address bar, browser history, or
    // an accidental screenshot/share of the tab.
    try{ window.history.replaceState({}, document.title, window.location.pathname); }catch(e){}
    setView('reset');
    return;
  }

  let acct = null;
  try{ acct = await getCurrentAccount(); }catch(e){}
  setView(acct ? 'home' : 'gate');
})();

</script>
