<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23f97316'/%3E%3C/svg%3E">
<title>SIGNAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

  :root{
    --bg:#F3F4F1;
    --bg-soft:#EBEDE8;
    --panel:#FBFBF9;
    --panel-raised:#F2F3EF;
    --text:#1B1F23;
    --muted:#68707B;
    --danger:#D6303C;
    --danger-glow:rgba(214,48,60,0.18);
    --danger-bg:rgba(214,48,60,0.08);
    --safe:#1B9A56;
    --safe-glow:rgba(27,154,86,0.16);
    --safe-bg:rgba(27,154,86,0.08);
    --accent:#C2760A;
    --accent-glow:rgba(194,118,10,0.16);
    --accent-bg:rgba(194,118,10,0.08);
    --info:#2563EB;
    --info-bg:rgba(37,99,235,0.08);
    --line:#DFE2DD;
    --shadow:0 1px 2px rgba(20,20,15,0.04), 0 6px 20px -10px rgba(20,20,15,0.12);
    --shadow-raised:0 4px 14px -4px rgba(20,20,15,0.16);
    --header-bg:rgba(243,244,241,0.92);
    color-scheme: light;
  }
  [data-theme="dark"]{
    --bg:#0B0E11;
    --bg-soft:#0E1216;
    --panel:#14181D;
    --panel-raised:#1B2027;
    --text:#F2F3F0;
    --muted:#8A93A3;
    --danger:#E5484D;
    --danger-glow:rgba(229,72,77,0.35);
    --danger-bg:rgba(229,72,77,0.1);
    --safe:#34C77B;
    --safe-glow:rgba(52,199,123,0.30);
    --safe-bg:rgba(52,199,123,0.08);
    --accent:#F2A93B;
    --accent-glow:rgba(242,169,59,0.28);
    --accent-bg:rgba(242,169,59,0.08);
    --info:#5aa9ff;
    --info-bg:rgba(90,169,255,0.08);
    --line:#232830;
    --shadow:0 1px 2px rgba(0,0,0,0.2), 0 8px 24px -10px rgba(0,0,0,0.5);
    --shadow-raised:0 6px 20px -6px rgba(0,0,0,0.55);
    --header-bg:rgba(11,14,17,0.92);
    color-scheme: dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    transition:background-color .25s ease, color .25s ease;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}
  a{color:inherit;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:4px;}

  header.top{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--header-bg);backdrop-filter:blur(6px);z-index:10;
    transition:background-color .25s ease, border-color .25s ease;
  }
  .header-actions{display:flex;align-items:center;gap:8px;}
  .brand{display:flex;align-items:center;gap:9px;}
  .brand-dot{width:9px;height:9px;border-radius:50%;background:var(--danger);box-shadow:0 0 8px var(--danger-glow);}
  .brand-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;letter-spacing:0.02em;}
  .brand-sub{font-size:10px;color:var(--muted);letter-spacing:0.14em;text-transform:uppercase;margin-left:2px;}
  .home-btn{background:none;border:1px solid var(--line);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:7px 12px;border-radius:7px;cursor:pointer;min-height:34px;transition:background-color .15s ease, border-color .15s ease;}
  .home-btn:hover{border-color:var(--muted);}
  .home-btn:active{background:var(--panel-raised);}

  .theme-toggle{
    display:flex;align-items:center;gap:6px;background:var(--panel-raised);border:1px solid var(--line);
    color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:7px 10px;border-radius:20px;
    cursor:pointer;min-height:34px;transition:background-color .15s ease, border-color .15s ease, color .15s ease;
  }
  .theme-toggle:hover{color:var(--text);border-color:var(--muted);}
  .theme-toggle .tt-icon{font-size:13px;line-height:1;}

  main{max-width:560px;margin:0 auto;padding:24px 20px 60px;}

  /* ---- SPLASH SCREEN ---- */
  #splash{
    position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;background:var(--bg);transition:opacity .5s ease;
  }
  #splash .splash-dot{width:14px;height:14px;border-radius:50%;background:var(--danger);box-shadow:0 0 16px var(--danger-glow);
    opacity:0;transform:scale(0.6);animation:splashFadeIn .6s ease forwards;}
  #splash .splash-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;letter-spacing:0.03em;color:var(--text);
    opacity:0;transform:translateY(6px);animation:splashFadeIn .6s ease forwards;animation-delay:.08s;}
  #splash .splash-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:0.18em;text-transform:uppercase;
    opacity:0;animation:splashFadeIn .6s ease forwards;animation-delay:.18s;}
  @keyframes splashFadeIn{to{opacity:1;transform:none;}}
  #splash.splash-out{opacity:0;pointer-events:none;}
  body.splash-active{overflow:hidden;}
  main.content-enter{animation:contentFadeIn .5s ease both;}
  @keyframes contentFadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  /* ---- VIEW TRANSITIONS ---- */
  main#app{position:relative;}
  .view-fade-in{animation:viewFadeIn .22s ease both;}
  @keyframes viewFadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  @media (prefers-reduced-motion: reduce){
    #splash .splash-dot, #splash .splash-name, #splash .splash-sub{animation:none;opacity:1;transform:none;}
    main.content-enter, .view-fade-in{animation:none;}
    #splash{transition:none;}
  }

  /* ---- INLINE VALIDATION ---- */
  .field.invalid input, .field.invalid select{border-color:var(--danger)!important;}
  .field-error{font-size:11px;color:var(--danger);margin-top:6px;line-height:1.5;display:none;}
  .field.invalid .field-error{display:block;}

  /* ---- ROLE PICKER ---- */
  .hero{padding:28px 0 8px;}
  .hero h1{font-family:'Space Grotesk',sans-serif;font-size:26px;line-height:1.25;margin:0 0 10px;}
  .hero p{color:var(--muted);font-size:14px;line-height:1.6;margin:0;}
  .role-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:26px;}
  .role-card{
    text-align:left;border-radius:16px;padding:22px;border:1px solid var(--line);
    background:var(--panel);cursor:pointer;box-shadow:var(--shadow);
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .role-card:hover{box-shadow:var(--shadow-raised);}
  .role-card:active{transform:scale(0.98);}
  .role-card.need{border-color:var(--danger-glow);}
  .role-card.need .role-eyebrow{color:var(--danger);}
  .role-card.vol{border-color:rgba(37,99,235,0.30);}
  .role-card.vol .role-eyebrow{color:var(--info);}
  .role-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.14em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
  .role-card h2{font-family:'Space Grotesk',sans-serif;font-size:19px;margin:0 0 6px;}
  .role-card p{color:var(--muted);font-size:13px;margin:0;line-height:1.5;}
  .admin-link-row{text-align:center;margin-top:18px;}
  .admin-link{background:none;border:none;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;text-decoration:underline;cursor:pointer;padding:8px;}

  /* ---- FORM FIELDS ---- */
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:0.08em;font-family:'IBM Plex Mono',monospace;}
  .field .req{color:var(--danger);}
  .field input, .field select, .field textarea{
    width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:13px 14px;border-radius:10px;font-size:15px;font-family:'Inter',sans-serif;
    min-height:46px;transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field select{-webkit-appearance:none;appearance:none;}
  .field input::placeholder, .field textarea::placeholder{color:var(--muted);opacity:0.8;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--info);box-shadow:0 0 0 3px var(--info-bg);}
  .field-hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5;}
  .field-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .sos-wrap{display:flex;flex-direction:column;align-items:center;padding:18px 0 8px;}
  .sos-ring-stage{position:relative;width:220px;height:220px;display:flex;align-items:center;justify-content:center;margin-bottom:22px;}
  .ring{position:absolute;border-radius:50%;border:1px solid var(--danger);opacity:0;}
  .pulsing .ring{animation:pulse 2.4s ease-out infinite;}
  .pulsing .ring:nth-child(2){animation-delay:.8s;}
  .pulsing .ring:nth-child(3){animation-delay:1.6s;}
  @keyframes pulse{
    0%{width:150px;height:150px;opacity:0.55;}
    100%{width:220px;height:220px;opacity:0;}
  }
  .sos-btn{
    position:relative;z-index:2;width:170px;height:170px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ff5b60, var(--danger));
    border:none;color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;
    letter-spacing:0.04em;box-shadow:0 0 0 6px rgba(229,72,77,0.12), 0 12px 30px -6px rgba(229,72,77,0.55);
    cursor:pointer;
  }
  .sos-btn:active{transform:scale(0.97);}
  .sos-btn[disabled]{opacity:0.5;cursor:default;}
  .sos-btn.mic-mode{
    background:radial-gradient(circle at 35% 30%, #5aa9ff, #3d7fd9);
    box-shadow:0 0 0 6px rgba(61,127,217,0.14), 0 12px 30px -6px rgba(61,127,217,0.55);
    font-size:16px;
  }
  .sos-btn.mic-mode.recording{
    background:radial-gradient(circle at 35% 30%, #ff5b60, var(--danger));
    box-shadow:0 0 0 6px rgba(229,72,77,0.16), 0 12px 30px -6px rgba(229,72,77,0.6);
    animation:mic-rec-pulse 1.2s ease-in-out infinite;
  }
  @keyframes mic-rec-pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.03);}}

  .status-line{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);text-align:center;margin:6px 0 6px;min-height:16px;}
  .status-line.live{color:var(--danger);}
  .wait-line{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);text-align:center;margin-bottom:20px;min-height:14px;}
  .wait-line.escalate-warn{color:var(--accent);}
  .wait-line.escalate-critical{color:var(--danger);font-weight:600;}

  .responder-found{width:100%;background:rgba(52,199,123,0.08);border:1px solid rgba(52,199,123,0.35);
    border-radius:14px;padding:16px;margin-bottom:18px;}
  .responder-found .rf-title{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--safe);font-size:14px;margin-bottom:8px;}
  .responder-found .rf-name{font-size:15px;font-weight:600;margin-bottom:2px;}
  .responder-found .rf-line{font-size:12px;color:var(--muted);line-height:1.6;}

  .safe-btn{
    width:100%;padding:18px;border-radius:14px;border:1px solid rgba(52,199,123,0.4);
    background:rgba(52,199,123,0.08);color:var(--safe);font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:16px;cursor:pointer;min-height:56px;
  }
  .safe-btn:active{background:rgba(52,199,123,0.16);}
  .safe-btn[disabled]{opacity:0.4;cursor:default;}

  .hint{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6;}
  .disclaimer{font-size:11px;color:var(--muted);text-align:center;margin-top:30px;padding-top:16px;border-top:1px solid var(--line);line-height:1.7;}

  /* ---- CARDS / DASH ---- */
  .reg-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:var(--shadow);}
  .reg-card h2{font-family:'Space Grotesk',sans-serif;font-size:18px;margin:0 0 6px;}
  .reg-card p{color:var(--muted);font-size:13px;margin:0 0 20px;line-height:1.5;}
  .primary-btn{
    width:100%;padding:14px;border-radius:10px;border:none;background:var(--text);color:var(--bg);
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;cursor:pointer;min-height:48px;
    transition:opacity .15s ease, transform .1s ease;
  }
  .primary-btn:hover{opacity:0.92;}
  .primary-btn:active{opacity:0.85;transform:scale(0.99);}
  .primary-btn[disabled]{opacity:0.4;}
  .secondary-btn{
    width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--text);
    font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:13px;cursor:pointer;min-height:46px;
    transition:background-color .15s ease, border-color .15s ease;
  }
  .secondary-btn:hover{border-color:var(--muted);}
  .secondary-btn:active{background:var(--panel-raised);}
  .btn-row{display:flex;gap:10px;margin-top:6px;}
  .btn-row .primary-btn, .btn-row .secondary-btn{flex:1;}

  .dash-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;}
  .dash-head h2{font-family:'Space Grotesk',sans-serif;font-size:18px;margin:0;}
  .dash-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}

  .signal-row{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;
    border-left:3px solid var(--danger);box-shadow:var(--shadow);
  }
  .signal-row.resolved{border-left-color:var(--safe);opacity:0.55;}
  .signal-row.responding{border-left-color:var(--accent);}
  .signal-row.escalate-warn{border-left-color:var(--accent);box-shadow:0 0 0 1px rgba(242,169,59,0.25) inset;}
  .signal-row.escalate-critical{border-left-color:var(--danger);box-shadow:0 0 0 1px rgba(229,72,77,0.4) inset;}
  .sig-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px;}
  .sig-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;}
  .sig-time{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
  .sig-badge{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;padding:3px 8px;border-radius:5px;white-space:nowrap;}
  .badge-active{background:rgba(229,72,77,0.15);color:var(--danger);}
  .badge-responding{background:rgba(242,169,59,0.15);color:var(--accent);}
  .badge-resolved{background:rgba(52,199,123,0.15);color:var(--safe);}
  .sig-note{font-size:13px;color:var(--muted);margin-bottom:10px;line-height:1.5;}
  .sig-wait{font-family:'IBM Plex Mono',monospace;font-size:11px;margin-bottom:8px;color:var(--muted);}
  .sig-wait.escalate-warn{color:var(--accent);font-weight:600;}
  .sig-wait.escalate-critical{color:var(--danger);font-weight:700;}
  .sig-category{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;
    letter-spacing:0.06em;padding:3px 8px;border-radius:5px;background:rgba(138,147,163,0.15);color:var(--muted);margin-bottom:8px;margin-right:6px;}
  .match-tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;
    letter-spacing:0.06em;padding:3px 8px;border-radius:5px;margin-bottom:8px;}
  .match-yes{background:rgba(52,199,123,0.15);color:var(--safe);}
  .match-no{background:rgba(229,72,77,0.12);color:var(--danger);}
  .assigned-block{background:rgba(242,169,59,0.08);border:1px solid rgba(242,169,59,0.3);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:12px;line-height:1.6;}
  .assigned-block b{color:var(--accent);}
  .sig-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .sig-actions a, .sig-actions button{
    font-family:'IBM Plex Mono',monospace;font-size:11px;padding:9px 12px;border-radius:7px;min-height:38px;
    border:1px solid var(--line);background:var(--panel-raised);color:var(--text);text-decoration:none;cursor:pointer;
  }
  .sig-actions button.accept-btn{border-color:rgba(52,199,123,0.4);color:var(--safe);}
  .sig-actions button.warn-btn{border-color:rgba(229,72,77,0.4);color:var(--danger);}
  .sig-actions button:active, .sig-actions a:active{background:#242a32;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}
  .refresh-btn{background:none;border:1px solid var(--line);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:6px 10px;border-radius:7px;cursor:pointer;min-height:34px;}
  .detail-panel{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--text);line-height:1.7;}
  .detail-panel .dp-row{margin-bottom:6px;}
  .detail-panel .dp-label{color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;font-family:'IBM Plex Mono',monospace;font-size:10px;}
  .not-qualified-warn{background:rgba(229,72,77,0.08);border:1px solid rgba(229,72,77,0.3);border-radius:8px;padding:10px;font-size:12px;color:var(--danger);margin:10px 0;line-height:1.5;}

  /* ---- NOTE FIELD ---- */
  textarea.note-input{
    width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:13px 14px;border-radius:10px;font-size:14px;font-family:'Inter',sans-serif;resize:vertical;min-height:64px;
  }
  textarea.note-input:focus{outline:none;border-color:var(--accent);}

  /* ---- AI TRIAGE ---- */
  .triage-tag{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:10px;
    text-transform:uppercase;letter-spacing:0.06em;padding:3px 8px;border-radius:5px;margin-right:6px;margin-bottom:8px;}
  .triage-critical{background:rgba(229,72,77,0.18);color:var(--danger);}
  .triage-urgent{background:rgba(242,169,59,0.18);color:var(--accent);}
  .triage-unclear{background:rgba(138,147,163,0.18);color:var(--muted);}
  .triage-not-distress{background:rgba(138,147,163,0.12);color:var(--muted);}
  .triage-pending{background:rgba(138,147,163,0.12);color:var(--muted);font-style:italic;}
  .self-harm-banner{background:rgba(229,72,77,0.1);border:1px solid rgba(229,72,77,0.35);border-radius:8px;
    padding:8px 10px;font-size:12px;color:var(--danger);margin-bottom:10px;line-height:1.5;}
  .ai-note{font-size:13px;color:var(--text);margin:8px 0;line-height:1.5;}
  .ai-facts{font-size:11px;color:var(--muted);margin-bottom:8px;font-family:'IBM Plex Mono',monospace;}
  .recv-audio{margin:8px 0;}
  .recv-audio audio{width:100%;height:34px;}
  .recv-audio-label{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;}

  /* ---- TOASTS ---- */
  #toastStack{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:50;
    display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;padding:0 20px;pointer-events:none;}
  .toast{
    background:var(--panel-raised);border:1px solid var(--line);color:var(--text);
    padding:11px 16px;border-radius:10px;font-size:13px;font-family:'Inter',sans-serif;
    box-shadow:0 8px 24px -8px rgba(0,0,0,0.6);max-width:420px;width:100%;text-align:center;
    opacity:0;transform:translateY(8px);transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1;transform:translateY(0);}
  .toast.toast-safe{border-color:rgba(52,199,123,0.4);}
  .toast.toast-danger{border-color:rgba(229,72,77,0.4);}

  .seed-btn{background:none;border:1px dashed var(--line);color:var(--muted);font-family:'IBM Plex Mono',monospace;
    font-size:11px;padding:8px 14px;border-radius:8px;cursor:pointer;margin-top:14px;min-height:38px;}
  .seed-btn:active{background:var(--panel-raised);}

  /* ---- VOICE RECORDER ---- */

<body class="splash-active">
<div id="splash" aria-hidden="true">
  <div class="splash-dot"></div>
  <div class="splash-name">SIGNAL</div>
  <div class="splash-sub">Community Distress Network</div>
</div>

<header class="top">
  <div class="brand">
    <div class="brand-dot" id="brandDot"></div>
    <span class="brand-name">SIGNAL</span>
    <span class="brand-sub">DISTRESS NETWORK</span>
  </div>
  <div class="header-actions">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light and dark mode">
      <span class="tt-icon" id="themeIcon">☀️</span><span id="themeLabel">LIGHT</span>
    </button>
    <button class="home-btn" id="acctHeaderBtn" type="button" style="display:none"></button>
    <button class="home-btn" id="homeBtn" type="button" style="display:none">← HOME</button>
  </div>
</header>

<main id="app"></main>
<div id="toastStack" role="status" aria-live="polite"></div>

<script>
/* =========================================================================
   SIGNAL — data model & shared utilities
   ========================================================================= */
const app = document.getElementById('app');
const homeBtn = document.getElementById('homeBtn');
const brandDot = document.getElementById('brandDot');

/* =========================================================================
   BACKEND API
   -------------------------------------------------------------------------
   SIGNAL now talks to a real Node.js + Express + SQLite backend (see
   backend/server.js) instead of browser storage. All application data
   (accounts, signals, rescuers, credentials, assignments) lives in
   backend/signal.db and is shared across every device/browser that hits
   this API — that's the whole point of the backend integration.

   Change API_BASE_URL to point at wherever you deploy the backend.
   ========================================================================= */
   const API_BASE_URL = 'https://hackathon-lk1o.onrender.com/api';

// Small localStorage helper used ONLY for harmless client-side bits that
// are not application data: theme preference, and a local pointer to
// "my active signal" (id + the one-time secret the backend issued when it
// was created, so this browser can mark it safe / attach voice updates
// without needing a login — sending an SOS never requires an account).
const localPrefs = {
  get(key){ try{ const v = localStorage.getItem('signal_local_' + key); return v == null ? null : JSON.parse(v); }catch(e){ return null; } },
  set(key, value){ try{ localStorage.setItem('signal_local_' + key, JSON.stringify(value)); }catch(e){} },
  remove(key){ try{ localStorage.removeItem('signal_local_' + key); }catch(e){} }
};

// Talks to the SIGNAL backend. Always sends cookies (`credentials:'include'`)
// so the HTTP-only auth cookie set by /api/auth/login is included. Returns
// the parsed `data` field on success, or throws an Error with a
// human-readable message on failure (callers show that via toast()).
async function apiFetch(path, options){
  options = options || {};
  const opts = {
    method: options.method || 'GET',
    credentials: 'include',
    headers: Object.assign({}, options.body ? {'Content-Type':'application/json'} : {}, options.headers || {}),
    body: options.body ? JSON.stringify(options.body) : undefined
  };
  let res, json;
  try{
    res = await fetch(API_BASE_URL + path, opts);
  }catch(e){
    throw new Error('Could not reach the SIGNAL backend. Is server.js running on ' + API_BASE_URL + '?');
  }
  try{ json = await res.json(); }catch(e){ json = null; }
  if (!res.ok || !json || json.success === false){
    const msg = (json && json.error) ? json.error : ('Request failed (' + res.status + ')');
    const err = new Error(msg);
    err.status = res.status;
    throw err;
  }
  return json.data;
}

/* =========================================================================
   THEME — light mode is the default; persisted to localStorage.
   ========================================================================= */
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('signal-theme'); }catch(e){}
  const theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
  applyTheme(theme);
  const toggleBtn = document.getElementById('themeToggle');
  toggleBtn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try{ localStorage.setItem('signal-theme', next); }catch(e){}
  });
})();
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const icon = document.getElementById('themeIcon');
  const label = document.getElementById('themeLabel');
  if (icon) icon.textContent = theme === 'dark' ? '🌙' : '☀️';
  if (label) label.textContent = theme === 'dark' ? 'DARK' : 'LIGHT';
}

/* =========================================================================
   SPLASH SCREEN — initial load only.
   ========================================================================= */
(function initSplash(){
  const splash = document.getElementById('splash');
  if (!splash) return;
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const holdMs = reduceMotion ? 0 : 650;
  const fadeMs = reduceMotion ? 0 : 500;
  setTimeout(() => {
    splash.classList.add('splash-out');
    document.body.classList.remove('splash-active');
    app.classList.add('content-enter');
    setTimeout(() => { splash.remove(); }, fadeMs);
  }, holdMs);
})();

let view = 'home';
let signals = [];
let pollTimer = null;   // full-data poll (dashboard / need view)
let tickTimer = null;   // 1s cosmetic ticker for waiting-time / escalation display

homeBtn.addEventListener('click', () => { setView('home'); });

function setView(v){
  view = v;
  // Hide immediately; refreshAccountHeader() (below) decides whether to
  // re-show it, based on login state — only logged-in users see "← HOME"
  // in the navbar, on any screen other than Home itself.
  homeBtn.style.display = 'none';
  if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  if (tickTimer){ clearInterval(tickTimer); tickTimer = null; }
  refreshAccountHeader();
  render();
  // subtle, fast fade/slide between views — skipped on the SOS "need help"
  // screen so emergency actions never wait on decorative motion.
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduceMotion && v !== 'need'){
    app.classList.remove('view-fade-in');
    void app.offsetWidth; // reflow to restart animation
    app.classList.add('view-fade-in');
  }
}

function timeAgo(ts){
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return s + 's ago';
  const m = Math.floor(s/60);
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m/60);
  return h + 'h ' + (m%60) + 'm ago';
}

function mmss(totalSeconds){
  const m = Math.floor(totalSeconds/60), s = Math.floor(totalSeconds%60);
  return `${m}:${s<10?'0'+s:s}`;
}

function daysUntil(dateStr){
  if (!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return null;
  return Math.ceil((d.getTime() - Date.now()) / 86400000);
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

function toast(message, kind){
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' toast-' + kind : '');
  el.textContent = message;
  stack.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 300);
  }, 3800);
}

function genId(prefix){
  return (prefix||'id') + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
}

/* ---- backend: distress signals (source of truth = SQLite via API) ---- */
async function loadSignals(){
  try{
    signals = await apiFetch('/signals');
  }catch(e){ signals = []; toast(e.message, null); }
  return signals;
}

/* ---- backend: rescuers ---- */
// Admin-only: full rescuer directory (used by the verification admin panel).
async function loadRescuers(){
  try{
    return await apiFetch('/admin/rescuers');
  }catch(e){ toast(e.message, null); return []; }
}

const CATEGORIES = {
  medical:       'Medical',
  fire:          'Fire',
  search_rescue: 'Search & Rescue',
  water:         'Water Emergency',
  disaster:      'Disaster',
  security:      'Security',
  mental_health: 'Mental Health/Crisis',
  general:       'General Assistance',
  unknown:       'Unknown'
};

const SPECIALIZATIONS = [
  'First Aid','CPR','Basic Life Support','Advanced Life Support','Fire Rescue',
  'Search and Rescue','Water Rescue','Disaster Response','Medical Response',
  'Mental Health/Crisis Response','Security/Evacuation','Technical Rescue','Other'
];

const RESPONDER_TYPES = [
  'Community Volunteer','EMT','Paramedic','Nurse','Physician','Firefighter',
  'Search & Rescue Team Member','Water Rescue Team Member','Security/Evacuation Officer',
  'Mental Health Professional','Other'
];

const CREDENTIAL_TYPES = ['Certification','License','Training Completion','Membership','Other'];

// Which specializations satisfy which emergency categories.
const QUALIFICATION_TO_CATEGORY = {
  medical:       ['First Aid','CPR','Basic Life Support','Advanced Life Support','Medical Response'],
  fire:          ['Fire Rescue','Disaster Response','Technical Rescue'],
  search_rescue: ['Search and Rescue','Disaster Response','Technical Rescue'],
  water:         ['Water Rescue','Disaster Response'],
  disaster:      ['Disaster Response','Search and Rescue','Fire Rescue','Water Rescue'],
  security:      ['Security/Evacuation'],
  mental_health: ['Mental Health/Crisis Response'],
  general:       [], // any verified rescuer may assist
  unknown:       []
};

// Returns true if a VERIFIED rescuer's specializations satisfy the category.
function isQualified(rescuer, category){
  if (!rescuer || rescuer.verificationStatus !== 'verified') return false;
  if (category === 'general' || category === 'unknown' || !category) return true;
  const needed = QUALIFICATION_TO_CATEGORY[category] || [];
  return (rescuer.specializations || []).some(s => needed.includes(s));
}

function matchLabel(category){
  return (CATEGORIES[category] || 'General Assistance').toUpperCase();
}

/* =========================================================================
   AI triage — now performed entirely by the backend (POST /api/triage,
   and automatically on signal creation / voice updates). The frontend no
   longer calls the Anthropic API directly or holds any AI credentials —
   see backend/server.js for the triage logic and prompt.
   ========================================================================= */

function getLocation(){
  return new Promise((resolve) => {
    if (!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({lat: pos.coords.latitude, lng: pos.coords.longitude}),
      () => resolve(null),
      {timeout: 6000}
    );
  });
}

function blobToDataUrl(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

/* =========================================================================
   Escalation model — a signal that has been ACTIVE (unclaimed) gets louder
   the longer it waits. This is purely a display/priority concept in the
   prototype; see "Remaining production requirements" for real dispatch.
   ========================================================================= */
function escalationLevel(sig){
  if (sig.status !== 'active') return 'none';
  const waitS = (Date.now() - sig.createdAt) / 1000;
  if (waitS >= 300) return 'critical'; // 5+ minutes
  if (waitS >= 120) return 'warn';     // 2-5 minutes
  return 'normal';
}
function escalationLabel(level){
  if (level === 'critical') return '🚨 UNRESPONDED EMERGENCY';
  if (level === 'warn') return '⚠ RESPONSE NEEDED';
  return '🚨 ACTIVE — NO RESPONDER';
}
function escalationClass(level){
  if (level === 'critical') return 'escalate-critical';
  if (level === 'warn') return 'escalate-warn';
  return '';
}

/* =========================================================================
   Voice recorder controller (SOS note capture)
   ========================================================================= */
const VOICE_MAX_SECONDS = 20;

function createVoiceController({button, timerEl, transcriptEl, playbackEl, onCapture}){
  const hasRecorder = !!(navigator.mediaDevices && window.MediaRecorder);
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let state = 'idle'; // idle | recording
  let mediaRecorder = null, chunks = [], recognition = null, finalTranscript = '', seconds = 0, tickHandle = null, stream = null;

  function setIdleMic(label){
    button.className = 'sos-btn mic-mode';
    button.innerHTML = label || '🎙️<br>TAP TO<br>SPEAK';
    button.disabled = false;
  }
  function setRecordingUI(){
    button.className = 'sos-btn mic-mode recording';
    button.innerHTML = '⏺<br>RECORDING<br>TAP TO STOP';
  }

  async function start(){
    if (!hasRecorder){
      toast('Voice recording not supported in this browser — text note still works', null);
      return;
    }
    try{
      stream = await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(e){
      toast('Microphone permission denied', null);
      return;
    }
    chunks = []; finalTranscript = ''; seconds = 0;
    const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
    mediaRecorder = mimeType ? new MediaRecorder(stream, {mimeType}) : new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.start();

    transcriptEl.style.display = 'block';
    if (SpeechRec){
      recognition = new SpeechRec();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++){
          const chunk = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalTranscript += chunk + ' ';
          else interim += chunk;
        }
        transcriptEl.classList.remove('placeholder');
        transcriptEl.textContent = (finalTranscript + interim).trim() || 'Listening…';
      };
      recognition.onerror = () => {};
      try{ recognition.start(); }catch(e){}
    } else {
      transcriptEl.classList.remove('placeholder');
      transcriptEl.textContent = 'Transcript unavailable in this browser — audio will still be sent.';
    }

    state = 'recording';
    setRecordingUI();
    timerEl.style.display = 'block';
    tickHandle = setInterval(() => {
      seconds++;
      const m = Math.floor(seconds/60), s = seconds%60;
      timerEl.textContent = `${m}:${s<10?'0'+s:s} / 0:${VOICE_MAX_SECONDS}`;
      if (seconds >= VOICE_MAX_SECONDS) stop();
    }, 1000);
  }

  function stop(){
    if (tickHandle){ clearInterval(tickHandle); tickHandle = null; }
    if (recognition){ try{ recognition.stop(); }catch(e){} }
    if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
    mediaRecorder.onstop = async () => {
      const blob = new Blob(chunks, {type: mediaRecorder.mimeType || 'audio/webm'});
      const dataUrl = await blobToDataUrl(blob);
      stream.getTracks().forEach(t => t.stop());
      timerEl.style.display = 'none';
      const transcript = finalTranscript.trim();
      playbackEl.innerHTML = `<div class="voice-playback"><audio controls src="${dataUrl}"></audio></div>`;
      state = 'idle';
      setIdleMic('🎙️<br>RE-RECORD');
      onCapture({audioDataUrl: dataUrl, transcript});
    };
    mediaRecorder.stop();
  }

  return {
    armMicMode(){ setIdleMic(); },
    handleClick(){ if (state === 'recording') stop(); else start(); },
    isRecording(){ return state === 'recording'; },
    cleanup(){ if (state === 'recording') stop(); }
  };
}

    startWatchingMySignal();
  });

  safeBtn.addEventListener('click', async () => {
    if (!mySignalId || !mySignalSecret) return;
    voiceCtl.cleanup();
    try{
      await apiFetch(`/signals/${mySignalId}/safe`, {method:'POST', body:{ownerSecret: mySignalSecret}});
    }catch(e){ toast(e.message, null); }
    localPrefs.remove('signal');
    resetToIdle();
    noteInput.value = '';
    categorySelect.value = '';
    toast('Marked safe — thanks for checking in', 'safe');
  });
}

/* =========================================================================
   RESCUER — entry point (router between signup / status / dashboard)
   ========================================================================= */
async function renderRescuer(){
  const acct = await getCurrentAccount();
  if (!acct){
    // Safety net: the "I'm a rescuer" button on Home already checks this,
    // but guard here too in case this view is reached another way.
    toast('Log in or create an account first to access the rescuer area', null);
    setView('login');
    return;
  }
  const myRescuer = await getMyRescuerRecord();
  if (!myRescuer){
    renderRescuerSignup();
    return;
  }
  if (myRescuer.verificationStatus === 'verified'){
    // check for expiry on any credential (auto-flip to expired for display)
    const expired = (myRescuer.credentials||[]).length > 0 &&
      (myRescuer.credentials||[]).every(c => { const d = daysUntil(c.expiry); return d != null && d < 0; });
    renderRescuerDashboard(myRescuer);
  } else {
    renderRescuerStatus(myRescuer);
  }
}

/* ---- VERIFICATION STATUS SCREEN (pending / rejected / expired) ---- */
function verifyBadgeHtml(status){
  const map = {
    pending:  {cls:'verify-pending',  label:'PENDING VERIFICATION'},
    verified: {cls:'verify-verified', label:'VERIFIED'},
    rejected: {cls:'verify-rejected', label:'REJECTED'},
    expired:  {cls:'verify-expired',  label:'CREDENTIAL EXPIRED'}
  };
  const m = map[status] || map.pending;
  return `<span class="verify-badge ${m.cls}"><span class="dot"></span>${m.label}</span>`;
}

function renderRescuerStatus(rescuer){
  const s = rescuer.verificationStatus;
  let bodyText = '';
  if (s === 'pending') bodyText = 'Your information has been submitted. A verifier will review your credentials before granting responder-dashboard access. This is simulated in the prototype — use the demo admin panel to approve or reject test accounts.';
  else if (s === 'rejected') bodyText = rescuer.adminNote ? `Your submission was not accepted: "${escapeHtml(rescuer.adminNote)}"` : 'Your submission was not accepted. You can update your information and resubmit.';
  else if (s === 'expired') bodyText = 'Your previously verified credentials have expired. Please update your credential dates and resubmit for re-verification.';

  app.innerHTML = `
    <div class="status-hero">
      ${verifyBadgeHtml(s)}
      <p style="margin-top:14px;">${bodyText}</p>
    </div>
    <div class="reg-card">
      <h2 class="display">Your submission</h2>
      <div class="profile-row"><span class="pr-label">Name</span><span class="pr-val">${escapeHtml(rescuer.fullName)}</span></div>
      <div class="profile-row"><span class="pr-label">Responder type</span><span class="pr-val">${escapeHtml(rescuer.responderType)}</span></div>
      <div class="profile-row"><span class="pr-label">Specializations</span><span class="pr-val">${rescuer.specializations.length ? escapeHtml(rescuer.specializations.join(', ')) : '—'}</span></div>
      <div class="profile-row"><span class="pr-label">Credentials</span><span class="pr-val">${rescuer.credentials.length}</span></div>
      <div class="btn-row" style="margin-top:16px;">
        <button class="secondary-btn" id="refreshStatus">↻ Refresh status</button>
        ${s !== 'pending' ? '<button class="primary-btn" id="editResubmit">Edit & resubmit</button>' : ''}
      </div>
      <div class="admin-link-row">
        <button class="admin-link" id="toAdmin">Open demo verification admin →</button>
        <button class="admin-link" id="statusBackHome">← Back to home</button>
      </div>
    </div>
  `;
  document.getElementById('refreshStatus').onclick = async () => {
    const fresh = await getMyRescuerRecord();
    if (fresh) renderRescuerStatus(fresh); else toast('Could not refresh — try again', null);
  };
  document.getElementById('toAdmin').onclick = () => setView('admin');
  document.getElementById('statusBackHome').onclick = () => setView('home');
  const editBtn = document.getElementById('editResubmit');
  // NOTE: responders can no longer flip their own verification status back
  // to "pending" from the frontend — only an admin can change a rescuer's
  // verification_status (server-enforced). This button now just points
  // them at the admin panel to request another look.
  if (editBtn) editBtn.onclick = () => {
    toast('Ask an admin to review your submission again from the verification admin panel.', null);
    setView('admin');
  };
}

   ========================================================================= */
async function renderRescuerDashboard(myRescuer){
  let tab = 'active'; // 'active' | 'profile'

  app.innerHTML = `
    <div class="admin-link-row" style="text-align:left;margin-bottom:8px;">

      <button class="section-tab" id="tabProfile">Profile</button>
    </div>
    <div id="dashBody"></div>
  `;
  document.getElementById('dashBackHome').onclick = () => setView('home');

  function drawStatusCard(r){
    const expiryWarnings = (r.credentials||[]).map(c => {
      const d = daysUntil(c.expiry);
      if (d == null) return '';
      if (d < 0) return `<div class="cred-expiry-crit">⚠ ${escapeHtml(c.name||'Credential')} certification expired.</div>`;
      if (d <= 30) return `<div class="cred-expiry-warn">⚠ ${escapeHtml(c.name||'Credential')} certification expires in ${d} day${d===1?'':'s'}.</div>`;
      return '';
    }).join('');
    document.getElementById('statusCard').innerHTML = `
      <div class="dash-head"><h2 class="display">My status</h2>${verifyBadgeHtml(r.verificationStatus)}</div>
      <div class="field-hint" style="margin-bottom:10px;">Specializations: ${r.specializations.length ? escapeHtml(r.specializations.join(' · ')) : '—'}</div>
      ${expiryWarnings}
      <div class="field-hint" style="margin-bottom:4px;">Availability</div>
      <div class="avail-row" id="availRow">
        <button class="avail-btn ${r.availability==='available'?'active-available':''}" data-a="available">Available</button>
        <button class="avail-btn ${r.availability==='busy'?'active-busy':''}" data-a="busy">Busy</button>
        <button class="avail-btn ${r.availability==='offline'?'active-offline':''}" data-a="offline">Offline</button>
      </div>
    `;
    document.getElementById('availRow').querySelectorAll('.avail-btn').forEach(btn => {
      btn.onclick = async () => {
        const a = btn.getAttribute('data-a');
        try{
          const updated = await apiFetch('/rescuers/me', {method:'PUT', body:{availability: a}});
          r.availability = updated.availability;
          toast('Availability updated: ' + a.toUpperCase(), null);
        }catch(e){ toast(e.message, null); }
        drawStatusCard(r);
      };
    });
  }
  drawStatusCard(myRescuer);

  document.getElementById('tabActive').onclick = () => { tab='active'; setTabs(); drawActiveTab(); };
  document.getElementById('tabProfile').onclick = () => { tab='profile'; setTabs(); drawProfileTab(); };
  function setTabs(){
    document.getElementById('tabActive').classList.toggle('active', tab==='active');
    document.getElementById('tabProfile').classList.toggle('active', tab==='profile');
  }

  const expandedIds = new Set();
  const urgencyRank = {critical:0, urgent:1, unclear:2, 'not-distress':3};

  function priorityScore(sig, qualified){
    if (sig.status === 'resolved') return 100000;
    const urgency = sig.triage ? sig.triage.urgency : 'unclear';
    const uRank = urgencyRank[urgency] !== undefined ? urgencyRank[urgency] : 2;
    const waitMin = sig.status === 'active' ? (Date.now() - sig.createdAt) / 60000 : 0;
    let score = uRank * 100;
    if (!qualified) score += 50;
    if (sig.status === 'responding') score += 30;
    score -= Math.min(waitMin, 20) * 2;
    return score;
  }

  async function drawActiveTab(){
    const body = document.getElementById('dashBody');
    body.innerHTML = `
      <div class="dash-head">
        <h2 class="display">Active emergencies</h2>
        <button class="refresh-btn" id="refreshBtn">↻ refresh</button>
      </div>
      <div class="dash-meta" style="margin-bottom:16px;">Sorted by priority · auto-updates every 5s</div>
      <div id="signalList"></div>
    `;
    document.getElementById('refreshBtn').onclick = drawList;

    let knownIds = null;
    let audioKnownIds = null;

    async function drawList(){
      const list = await loadSignals();
      const container = document.getElementById('signalList');
      const fresh = await getMyRescuerRecord(); // pick up availability/verification changes made elsewhere
      if (fresh) myRescuer = fresh;

      if (knownIds){
        const newOnes = list.filter(s => !knownIds.has(s.id) && s.status === 'active');
        newOnes.forEach(s => {
          const q = isQualified(myRescuer, s.category);
          toast((q ? 'New matching signal: ' : 'New signal: ') + s.name, 'danger');
        });
      }
      knownIds = new Set(list.map(s => s.id));

      if (audioKnownIds){
        const newAudio = list.filter(s => s.audioDataUrl && !audioKnownIds.has(s.id));
        newAudio.forEach(s => toast('Voice update received: ' + s.name, 'danger'));
      }
      audioKnownIds = new Set(list.filter(s => s.audioDataUrl).map(s => s.id));

      if (!list.length){
        container.innerHTML = `
          <div class="empty-state">
            No signals yet. This board updates automatically when someone sends an SOS.
            <br><button class="seed-btn" id="seedBtn">Load demo signals</button>
          </div>`;
        const seedBtn = document.getElementById('seedBtn');
        if (seedBtn) seedBtn.onclick = async () => { await seedDemoSignals(); drawList(); };
        return;
      }

      const withScore = list.map(sig => ({sig, qualified: isQualified(myRescuer, sig.category)}));
      withScore.sort((a,b) => priorityScore(a.sig,a.qualified) - priorityScore(b.sig,b.qualified));

      container.innerHTML = withScore.map(({sig, qualified}) => {
        const level = escalationLevel(sig);
        const statusClass = sig.status === 'resolved' ? 'resolved' : (sig.status === 'responding' ? 'responding' : escalationClass(level));
        const badgeClass = sig.status === 'resolved' ? 'badge-resolved' : (sig.status === 'responding' ? 'badge-responding' : 'badge-active');
        const badgeText = sig.status === 'resolved' ? 'RESOLVED' : (sig.status === 'responding' ? 'RESPONDER ASSIGNED' : (level==='normal'?'ACTIVE — UNCLAIMED':escalationLabel(level)));
        const locLine = (sig.lat != null) ? `<a href="https://www.google.com/maps?q=${sig.lat},${sig.lng}" target="_blank" rel="noopener">📍 open location</a>` : '';
        const category = sig.category || (sig.triage && sig.triage.incident_type) || 'unknown';
        const catLabel = CATEGORIES[category] || 'Unknown';
        const waitS = sig.status === 'active' ? Math.floor((Date.now()-sig.createdAt)/1000) : null;

        const audioBlock = sig.audioDataUrl ? `
          <div class="recv-audio">
            <div class="recv-audio-label">🎙️ Voice update</div>
            <audio controls src="${sig.audioDataUrl}"></audio>
          </div>` : '';

        let triageBlock = '';
        if (sig.note || sig.voiceTranscript){
          if (!sig.triage){
            triageBlock = `<span class="triage-tag triage-pending">analyzing note…</span>`;
          } else {
            const t = sig.triage;
            const tagClass = 'triage-' + (t.urgency || 'unclear');
            const harmBanner = t.self_harm_flag ? `<div class="self-harm-banner">⚠ Note flagged for possible self-harm risk — treat as highest priority and consider looping in a crisis line alongside your response.</div>` : '';
            const facts = (t.extracted_facts && t.extracted_facts.length) ? `<div class="ai-facts">${t.extracted_facts.map(escapeHtml).join(' · ')}</div>` : '';
            triageBlock = `
              ${harmBanner}
              <span class="triage-tag ${tagClass}">${(t.urgency || 'unclear').toUpperCase()}</span>
              <div class="ai-note">${escapeHtml(t.summary || '')}</div>
              ${facts}
            `;
          }
        }

        const assignedBlock = sig.status === 'responding' ? `
          <div class="assigned-block">
            <b>${sig.assignedRescuerId === myRescuer.id ? 'You are' : escapeHtml(sig.assignedRescuerName||'A responder') + ' is'} responding.</b><br>
            Qualification: ${escapeHtml(sig.assignedQualification || '—')} · Accepted ${sig.acceptedAt ? timeAgo(sig.acceptedAt) : '—'}
          </div>` : '';

        const isExpanded = expandedIds.has(sig.id);
        const detail = isExpanded ? `
          <div class="detail-panel">
            <div class="dp-row"><span class="dp-label">Type:</span> ${escapeHtml(sig.name)}${sig.lat==null?' · location unavailable':''}</div>
            <div class="dp-row"><span class="dp-label">Description:</span> ${escapeHtml(sig.note || '—')}</div>
            <div class="dp-row"><span class="dp-label">Required qualification:</span> ${escapeHtml((QUALIFICATION_TO_CATEGORY[category]||[]).join(', ') || 'None specific — general assistance')}</div>
            <div class="dp-row"><span class="dp-label">Your matching qualification:</span> ${escapeHtml((myRescuer.specializations||[]).filter(s => (QUALIFICATION_TO_CATEGORY[category]||[]).includes(s)).join(', ') || 'None')}</div>
            ${!qualified ? `<div class="not-qualified-warn">⚠ You are not verified for this emergency type. You may still assist if no qualified responder is available, but you should proceed with appropriate caution.</div>` : ''}
          </div>` : '';

        const acceptDisabled = sig.status !== 'active';
        const actions = sig.status === 'resolved' ? '' : `
          ${sig.status === 'active' ? `<button data-act="toggle" data-id="${sig.id}">${isExpanded ? 'Hide details' : 'Review details'}</button>` : ''}
          ${sig.status === 'active' ? `<button class="${qualified?'accept-btn':'warn-btn'}" data-act="accept" data-id="${sig.id}" ${acceptDisabled?'disabled':''}>${qualified ? '✓ ACCEPT & RESPOND' : '⚠ ACCEPT ANYWAY'}</button>` : ''}
          ${sig.status === 'responding' && sig.assignedRescuerId === myRescuer.id ? `<button data-act="withdraw" data-id="${sig.id}">Withdraw</button><button data-act="resolve" data-id="${sig.id}">Mark resolved</button>` : ''}
          ${locLine}
        `;

        return `
          <div class="signal-row ${statusClass}">
            <div class="sig-top">
              <div class="sig-name display">${escapeHtml(sig.name)}</div>
              <div class="sig-badge ${badgeClass} mono">${badgeText}</div>
            </div>
            <div class="sig-time mono">${timeAgo(sig.createdAt)}</div>
            <div>
              <span class="sig-category mono">${escapeHtml(catLabel)}</span>
              <span class="match-tag ${qualified?'match-yes':'match-no'} mono">${qualified?'MATCH: '+matchLabel(category)+' ✓':'NOT QUALIFIED FOR THIS INCIDENT'}</span>
            </div>
            ${waitS != null ? `<div class="sig-wait ${escalationClass(level)} mono">Waiting for responder: ${mmss(waitS)}</div>` : ''}
            ${assignedBlock}
            ${audioBlock}
            ${triageBlock}
            ${detail}
            <div class="sig-actions" style="margin-top:10px;">${actions}</div>
          </div>
        `;
      }).join('');

      container.querySelectorAll('button[data-act]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          const act = btn.getAttribute('data-act');

          if (act === 'toggle'){
            if (expandedIds.has(id)) expandedIds.delete(id); else expandedIds.add(id);
            drawList();
            return;
          }

          if (act === 'accept'){
            const current = await loadSignals();
            const sig = current.find(s => s.id === id);
            if (!sig) return;
            if (sig.status !== 'active'){
              toast('This emergency has already been assigned to another responder.', null);
              drawList();
              return;
            }
            const category = sig.category || (sig.triage && sig.triage.incident_type) || 'unknown';
            const qualified = isQualified(myRescuer, category);
            if (!qualified && !confirm('You are not verified for this emergency type. Accept anyway?')) return;
            // The backend independently re-checks status/verification/
            // qualification and computes the actual assignment — this
            // frontend check is only for the confirm-dialog UX.
            try{
              await apiFetch(`/signals/${id}/accept`, {method:'POST'});
              toast('Emergency accepted — you are now responding', 'safe');
            }catch(e){ toast(e.message, null); }
            drawList();
            return;
          }

          if (act === 'withdraw'){
            try{
              await apiFetch(`/signals/${id}/withdraw`, {method:'POST'});
              toast('Withdrawn — signal is active again', null);
            }catch(e){ toast(e.message, null); }
            drawList();
            return;
          }

          if (act === 'resolve'){
            try{
              await apiFetch(`/signals/${id}/resolve`, {method:'POST'});
              toast('Marked as resolved', 'safe');
            }catch(e){ toast(e.message, null); }
            drawList();
            return;
          }
        });
      });
    }

    await drawList();
    pollTimer = setInterval(drawList, 5000);
  }

  function drawProfileTab(){
    if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
    const body = document.getElementById('dashBody');
    const credRows = (myRescuer.credentials||[]).map(c => {
      const d = daysUntil(c.expiry);
      let warn = '';
      if (d != null && d < 0) warn = `<div class="cred-expiry-crit">⚠ Expired</div>`;
      else if (d != null && d <= 30) warn = `<div class="cred-expiry-warn">⚠ Expires in ${d} day${d===1?'':'s'}</div>`;
      return `
        <div class="cred-card">
          <div class="cred-card-head"><span>${escapeHtml(c.name || 'Credential')}</span><span class="mono">${escapeHtml(c.type||'')}</span></div>
          <div class="profile-row"><span class="pr-label">Issuing org</span><span class="pr-val">${escapeHtml(c.org||'—')}</span></div>
          <div class="profile-row"><span class="pr-label">Number</span><span class="pr-val">${c.number ? escapeHtml(c.number.slice(0,3) + '•••' + c.number.slice(-2)) : '—'}</span></div>
          <div class="profile-row"><span class="pr-label">Issued</span><span class="pr-val">${escapeHtml(c.issued||'—')}</span></div>
          <div class="profile-row"><span class="pr-label">Expires</span><span class="pr-val">${escapeHtml(c.expiry||'—')}</span></div>
          ${warn}
        </div>`;
    }).join('') || '<div class="field-hint">No credentials on file.</div>';

    body.innerHTML = `
      <div class="reg-card">
        <h2 class="display">Responder profile</h2>
        <div class="profile-row"><span class="pr-label">Name</span><span class="pr-val">${escapeHtml(myRescuer.fullName)}</span></div>
        <div class="profile-row"><span class="pr-label">Status</span><span class="pr-val">${verifyBadgeHtml(myRescuer.verificationStatus)}</span></div>
        <div class="profile-row"><span class="pr-label">Responder type</span><span class="pr-val">${escapeHtml(myRescuer.responderType)}</span></div>
        <div class="profile-row"><span class="pr-label">Organization</span><span class="pr-val">${escapeHtml(myRescuer.org||'—')}</span></div>
        <div class="profile-row"><span class="pr-label">Experience</span><span class="pr-val">${escapeHtml(myRescuer.yearsExp||'0')} yrs</span></div>
        <div class="profile-row"><span class="pr-label">Contact</span><span class="pr-val">${escapeHtml(myRescuer.phone)} · ${escapeHtml(myRescuer.email)}</span></div>
        <div class="profile-row"><span class="pr-label">Response radius</span><span class="pr-val">${escapeHtml(myRescuer.maxRadius||'—')} km</span></div>
        <div class="profile-row"><span class="pr-label">Areas</span><span class="pr-val">${escapeHtml(myRescuer.areas||'—')}</span></div>
        <div class="profile-row"><span class="pr-label">Specializations</span><span class="pr-val">${escapeHtml((myRescuer.specializations||[]).join(', ')||'—')}</span></div>
        <div class="profile-row"><span class="pr-label">Availability</span><span class="pr-val">${escapeHtml((myRescuer.availability||'available').toUpperCase())}</span></div>
      </div>
      <div class="reg-card">
        <h2 class="display">Credentials & certifications</h2>
        ${credRows}
      </div>
    `;
  }

  drawActiveTab();
}

/* =========================================================================
   DEMO VERIFICATION ADMIN
   ========================================================================= */
async function renderAdmin(){
  // Server-enforced: only the one shared admin account (role = "admin",
  // logged in via the normal SIGNAL login form) can reach this panel's
  // data — every /api/admin/* call checks req.user.role on the backend.
  // This client-side check is presentation only, so non-admins get a clear
  // message instead of an empty screen full of failed requests.
  const acct = await getCurrentAccount();
  if (!acct || acct.role !== 'admin'){
    app.innerHTML = `
      <div class="admin-link-row" style="text-align:left;margin-bottom:8px;">
        <button class="admin-link" id="adminBackHome">← Back to home</button>
      </div>
      <div class="reg-card">
        <h2 class="display">Admin access only</h2>
        <p>Rescuer verification is restricted to the SIGNAL administrator account. Log in with the shared admin account (see your team's .env) to open this panel.</p>
        <div class="btn-row" style="margin-top:14px;"><button class="primary-btn" id="adminToLogin">Log in</button></div>
      </div>
    `;
    document.getElementById('adminBackHome').onclick = () => setView('home');
    document.getElementById('adminToLogin').onclick = () => setView('login');
    return;
  }
  app.innerHTML = `
    <div class="admin-link-row" style="text-align:left;margin-bottom:8px;">
      <button class="admin-link" id="adminBackHome">← Back to home</button>
    </div>
    <div class="demo-banner"><b>ADMIN-ONLY VERIFICATION.</b> Only the shared SIGNAL admin account can approve, reject, or request more info from a responder — enforced by the backend, not just hidden in the UI.</div>
    <div class="dash-head">
      <h2 class="display">Rescuer verification</h2>
      <button class="refresh-btn" id="refreshAdmin">↻ refresh</button>
    </div>
    <div id="adminList"></div>
  `;
  document.getElementById('refreshAdmin').onclick = drawAdmin;
  document.getElementById('adminBackHome').onclick = () => setView('home');

  async function drawAdmin(){
    const list = await loadRescuers();
    const container = document.getElementById('adminList');
    if (!list.length){
      container.innerHTML = `<div class="empty-state">No rescuer sign-ups yet.</div>`;
      return;
    }
    const order = {pending:0, expired:1, verified:2, rejected:3};
    const sorted = [...list].sort((a,b) => (order[a.verificationStatus]??9) - (order[b.verificationStatus]??9) || b.createdAt - a.createdAt);

    container.innerHTML = sorted.map(r => {
      const credLines = (r.credentials||[]).map(c => {
        const d = daysUntil(c.expiry);
        const expTxt = c.expiry ? `${escapeHtml(c.expiry)}${d!=null && d<0 ? ' (EXPIRED)' : ''}` : '—';
        return `<div class="profile-row"><span class="pr-label">${escapeHtml(c.name||'Credential')}</span><span class="pr-val">${escapeHtml(c.org||'—')} · #${escapeHtml(c.number||'—')} · exp ${expTxt}</span></div>`;
      }).join('') || '<div class="field-hint">No credentials submitted.</div>';

      return `
        <div class="admin-row">
          <div class="admin-row-head">
            <div class="admin-name">${escapeHtml(r.fullName)}</div>
            ${verifyBadgeHtml(r.verificationStatus)}
          </div>
          <div class="admin-sub">
            ${escapeHtml(r.responderType)} · ${escapeHtml(r.org||'Independent')} · ${escapeHtml(r.yearsExp||'0')} yrs experience<br>
            Specializations: ${escapeHtml((r.specializations||[]).join(', ')||'—')}
          </div>
          ${credLines}
          ${r.adminNote ? `<div class="field-hint" style="margin-top:8px;">Verifier note: ${escapeHtml(r.adminNote)}</div>` : ''}
          <div class="admin-actions">
            <button class="approve" data-act="approve" data-id="${r.id}">Approve</button>
            <button class="reject" data-act="reject" data-id="${r.id}">Reject</button>
            <button data-act="info" data-id="${r.id}">Request more info</button>
          </div>
        </div>
      `;
    }).join('');

    container.querySelectorAll('button[data-act]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-id');
        const act = btn.getAttribute('data-act');
        const rescuerRow = (await loadRescuers()).find(r => r.id === id);
        if (!rescuerRow) return;
        try{
          // Server-enforced admin-only endpoints — the backend checks
          // req.user.role === 'admin' on every one of these regardless of
          // what this panel sends.
          if (act === 'approve'){
            await apiFetch(`/admin/rescuers/${id}/verify`, {method:'PATCH'});
          } else if (act === 'reject'){
            const note = prompt('Reason for rejection (shown to the rescuer):', rescuerRow.adminNote || '');
            if (note === null) return;
            await apiFetch(`/admin/rescuers/${id}/reject`, {method:'PATCH', body:{note, status:'rejected'}});
          } else if (act === 'info'){
            const note = prompt('What additional information is needed?', rescuerRow.adminNote || '');
            if (note === null) return;
            await apiFetch(`/admin/rescuers/${id}/reject`, {method:'PATCH', body:{note, status:'pending'}});
          }
          toast('Updated ' + rescuerRow.fullName, 'safe');
        }catch(e){ toast(e.message, null); }
        drawAdmin();
      });
    });
  }

  await drawAdmin();
}

      </div>
    </div>
  `;
  const idField = document.getElementById('fldLoginId');
  const pwField = document.getElementById('fldLoginPw');
  const idInput = document.getElementById('loginId');
  const pwInput = document.getElementById('loginPw');
  const submitBtn = document.getElementById('submitLogin');

  document.getElementById('toggleLoginPw').onclick = (e) => {
    const btn = e.currentTarget;
    const showing = pwInput.type === 'text';
    pwInput.type = showing ? 'password' : 'text';
    btn.textContent = showing ? 'SHOW' : 'HIDE';
    btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  };
  document.getElementById('loginToHome').onclick = () => setView('home');
  document.getElementById('toForgot').onclick = () => setView('forgot');
  document.getElementById('toSignup').onclick = () => setView('signup');
  document.getElementById('loginPrivacyLink').onclick = () => openPrivacyModal();

  submitBtn.onclick = async () => {
    document.getElementById('loginError').innerHTML = '';
    let valid = true;
    if (!idInput.value.trim()){ idField.classList.add('invalid'); valid = false; } else idField.classList.remove('invalid');
    if (!pwInput.value){ pwField.classList.add('invalid'); valid = false; } else pwField.classList.remove('invalid');
    if (!valid) return;

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span>Logging in…';
    idInput.disabled = true; pwInput.disabled = true;

    try{
      // The backend looks the account up by email OR phone, verifies the
      // bcrypt hash, and sets the HTTP-only session cookie on success.
      await apiFetch('/auth/login', {method:'POST', body:{identifier: idInput.value.trim(), password: pwInput.value}});
      toast('Logged in', 'safe');
      setView('home');
      return;
    }catch(e){
      document.getElementById('loginError').innerHTML = `<div class="form-error-banner">${escapeHtml(e.message)}</div>`;
    }

    submitBtn.disabled = false;
    submitBtn.textContent = 'LOG IN';
    idInput.disabled = false; pwInput.disabled = false;
  };
  pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitBtn.click(); });
}
